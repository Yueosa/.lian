[package]
name = "clipboard-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1

[[bin]]
name = "clipboardctl"
path = "src/main.rs"
