[package]
name = "lyrics-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
ureq = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31" }

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1

[[bin]]
name = "lyrics-fetch"
path = "src/main.rs"
