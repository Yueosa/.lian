[package]
name = "notif-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1

[[bin]]
name = "notifctl"
path = "src/main.rs"
